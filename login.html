<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conecta ADM - Login</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>
:root{--bg:#070b14;--panel:#0e1728;--line:#263957;--blue:#638cff;--text:#f4f7ff;--muted:#a3b1c7}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 12% 8%,rgba(75,113,210,.24),transparent 38%),radial-gradient(ellipse at 88% 82%,rgba(81,55,155,.2),transparent 38%),linear-gradient(145deg,#070b14,#0a1020 55%,#080b15);padding:clamp(18px,4vw,40px);min-height:100vh;display:grid;place-items:center;position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:0;border:1px solid rgba(113,148,230,.11);border-radius:50%}
body:before{width:460px;height:460px;top:-220px;right:-130px;box-shadow:0 0 0 45px rgba(113,148,230,.025),0 0 0 90px rgba(113,148,230,.018)}
body:after{width:380px;height:380px;bottom:-230px;left:-110px;box-shadow:0 0 0 55px rgba(113,148,230,.025),0 0 0 110px rgba(113,148,230,.018)}
.container{position:relative;z-index:1;width:min(460px,100%);margin:auto}
.logo-area{text-align:center;margin-bottom:28px}
.logo{display:inline-flex;align-items:center;gap:13px;font-size:26px;font-weight:850;letter-spacing:-.7px}
.logo-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#6e98ff,#3d6fe8);box-shadow:0 12px 32px rgba(61,111,232,.3);font-size:20px;font-weight:900}
.card{background:linear-gradient(145deg,rgba(19,31,52,.98),rgba(9,16,29,.98));border:1px solid var(--line);border-radius:26px;padding:clamp(25px,5vw,42px);box-shadow:0 30px 80px rgba(0,0,0,.34);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;width:320px;height:320px;right:-190px;top:-210px;background:radial-gradient(circle,rgba(93,140,255,.22),transparent 70%);pointer-events:none}
h1{font-size:clamp(28px,5vw,36px);line-height:1.2;margin:0 0 8px;letter-spacing:-.8px}
.subtitle{color:var(--muted);font-size:15px;margin:0 0 30px}
.field{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:700;color:#dce5f7}
input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid #2b3d5b;background:#080f1d;color:var(--text);font-size:15px;outline:none;transition:.2s}
.password-wrap{position:relative}
.password-wrap input{padding-right:56px}
.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;padding:0;border:0;background:transparent;box-shadow:none;color:#93a9d0;display:grid;place-items:center}
.toggle-password:hover{transform:translateY(-50%);filter:none;background:#16233a}
.toggle-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input::placeholder{color:#687a94}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(99,140,255,.13)}
.forgot{display:block;text-align:right;margin:-5px 0 22px;color:#91adff;font-size:13px;text-decoration:none}
.forgot:hover{text-decoration:underline}
button{width:100%;padding:15px;border-radius:12px;border:1px solid #4775e8;background:linear-gradient(120deg,#648cff,#416fe6);color:white;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(61,111,232,.2);transition:.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.06)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
#message{margin-top:16px;text-align:center;font-size:14px;line-height:1.5;color:var(--muted)}
.register{margin-top:26px;padding-top:22px;border-top:1px solid #1a2942;text-align:center;color:var(--muted);font-size:14px}
.register a{color:#91adff;text-decoration:none;font-weight:750}
.register a:hover{text-decoration:underline}
.back-home{display:block;text-align:center;margin-top:19px;color:#8190a7;font-size:13px;text-decoration:none}
.back-home:hover{color:#d0dcf2}
@media(max-width:500px){body{padding:20px 14px}.container{max-width:440px}.logo-area{margin-bottom:22px}.logo{font-size:23px}.logo-icon{width:41px;height:41px;border-radius:13px}.card{padding:25px 21px;border-radius:20px}h1{font-size:28px}.subtitle{font-size:14px;margin-bottom:24px}input{padding:14px}button{padding:14px}}
@media(max-width:360px){body{padding:12px}.card{padding:21px 17px}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>


<body>


  <div class="container">
ion>


    <!-- LOGO -->

    <div class="logo-area">

      <div class="logo">

        <div class="logo-icon">
          C
        </div>

        <span>
          Conecta ADM
        </span>

      </div>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">


      <h1>
        Entrar
      </h1>


      <p class="subtitle">
        Entre na sua conta do Conecta ADM.
      </p>


      <form id="loginForm">


        <!-- E-MAIL -->

        <div class="field">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- SENHA -->

        <div class="field">

          <label for="password">
            Senha
          </label>

          <div class="password-wrap"><input
            id="password"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
          ><button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar senha" title="Mostrar senha"><svg viewBox="0 0 24 24" id="eyeIcon"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>

        </div>


        <!-- ESQUECI SENHA -->

        <a
          href="#"
          class="forgot"
          id="forgotPassword"
        >
          Esqueci minha senha
        </a>


        <!-- ENTRAR -->

        <button
          type="submit"
          id="loginButton"
        >
          Entrar
        </button>


      </form>


      <!-- MENSAGEM -->

      <div id="message"></div>


      <!-- CADASTRO -->

      <div class="register">

        Ainda não tem uma conta?

        <a href="cadastro.html">
          Criar conta
        </a>

      </div>


    </div>


    <!-- VOLTAR -->

    <a
      href="index.html"
      class="back-home"
    >
      ← Voltar para o início
    </a>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const client = window.getSupabaseClient();
    const passwordInput=document.getElementById("password");
    const togglePassword=document.getElementById("togglePassword");
    togglePassword.addEventListener("click",()=>{const visible=passwordInput.type==="password";passwordInput.type=visible?"text":"password";togglePassword.setAttribute("aria-label",visible?"Ocultar senha":"Mostrar senha");togglePassword.title=visible?"Ocultar senha":"Mostrar senha";document.getElementById("eyeIcon").innerHTML=visible?'<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3.2 4.1"/><path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';});


    const form =
      document.getElementById("loginForm");


    const button =
      document.getElementById("loginButton");


    const message =
      document.getElementById("message");


    /* =========================
       LOGIN
    ========================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        button.disabled = true;

        button.textContent = "Entrando...";

        message.textContent = "";


        try {
          const { data, error } =
            await client.auth.signInWithPassword({
              email: email,
              password: password
            });

          if (error) {

          message.textContent =
            "Não foi possível entrar: " +
            error.message;


          button.disabled = false;

          button.textContent = "Entrar";

            return;
          }

          if (data.session) {
            window.location.href = "dashboard.html";
          } else {
            message.textContent = "Login realizado, mas não foi possível iniciar a sessão. Tente novamente.";
            button.disabled = false;
            button.textContent = "Entrar";
          }
        } catch (error) {
          console.error(error);
          message.textContent = "Erro de conexão. Verifique sua internet e tente novamente.";
          button.disabled = false;
          button.textContent = "Entrar";
        }
      }
    );


    /* =========================
       RECUPERAR SENHA
    ========================= */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          if (!email) {

            message.textContent =
              "Digite seu e-mail primeiro.";

            return;

          }


          try {
            const { error } =
              await client.auth.resetPasswordForEmail(email, {
                redirectTo: new URL("redefinir-senha.html", window.location.href).href
              });

            if (error) {

            message.textContent =
              "Não foi possível enviar o e-mail: " +
              error.message;

              return;
            }

            message.textContent = "Enviamos um e-mail para redefinir sua senha.";
          } catch (error) {
            console.error(error);
            message.textContent = "Erro de conexão. Tente novamente.";
          }
        }
      );

  </script>


</body>

</html>
