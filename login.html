<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Conecta ADM - Login</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    /* =========================
       PALETA CONECTA ADM
    ========================= */

    :root {

      --bg: #070b14;
      --bg2: #0b1120;

      --card: #0d1525;
      --card2: #111c30;

      --line: #1c2b46;

      --blue: #5d8cff;
      --blue2: #3d6fe8;

      --purple: #8b5cf6;

      --text: #f5f7ff;
      --muted: #9aa8bd;
      --muted2: #6f7e95;

    }


    /* =========================
       RESET
    ========================= */

    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

    }


    html {

      min-height: 100%;

    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:

        radial-gradient(
          circle at 50% -10%,
          rgba(61,111,232,.12),
          transparent 35%
        ),

        var(--bg);

      color: var(--text);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px 20px;

      line-height: 1.6;

    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

      width: 100%;

      max-width: 470px;

    }


    /* =========================
       LOGO
    ========================= */

    .logo-area {

      text-align: center;

      margin-bottom: 25px;

    }


    .logo {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      font-size: 25px;

      font-weight: 800;

      letter-spacing: -.5px;

    }


    .logo-icon {

      width: 42px;

      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background:

        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      box-shadow:

        0 12px 30px
        rgba(61,111,232,.20);

      font-size: 19px;

      font-weight: 900;

    }


    /* =========================
       CARD
    ========================= */

    .card {

      background:

        linear-gradient(
          145deg,
          rgba(17,28,48,.96),
          rgba(10,17,30,.96)
        );

      border: 1px solid var(--line);

      border-radius: 18px;

      padding: 32px;

      box-shadow:

        0 25px 70px
        rgba(0,0,0,.28);

      position: relative;

      overflow: hidden;

    }


    .card::before {

      content: "";

      position: absolute;

      width: 300px;

      height: 300px;

      top: -210px;

      right: -130px;

      background:

        radial-gradient(
          circle,
          rgba(93,140,255,.10),
          transparent 65%
        );

      pointer-events: none;

    }


    /* =========================
       TITLE
    ========================= */

    h1 {

      font-size: 28px;

      line-height: 1.2;

      margin-bottom: 8px;

      letter-spacing: -.5px;

    }


    .subtitle {

      color: var(--muted);

      font-size: 15px;

      margin-bottom: 28px;

    }


    /* =========================
       FORM
    ========================= */

    .field {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;

      color: #dce5f7;

    }


    input {

      width: 100%;

      padding: 14px 15px;

      border-radius: 10px;

      border: 1px solid #273853;

      background: rgba(7,11,20,.65);

      color: var(--text);

      font-size: 15px;

      outline: none;

      transition: .2s;

    }


    input::placeholder {

      color: #66768e;

    }


    input:focus {

      border-color: var(--blue);

      box-shadow:

        0 0 0 3px
        rgba(93,140,255,.10);

      background: rgba(7,11,20,.82);

    }


    /* =========================
       ESQUECI SENHA
    ========================= */

    .forgot {

      display: block;

      text-align: right;

      margin-top: -6px;

      margin-bottom: 22px;

      color: #8faeff;

      font-size: 13px;

      text-decoration: none;

      transition: .2s;

    }


    .forgot:hover {

      color: var(--blue);

      text-decoration: underline;

    }


    /* =========================
       BUTTON
    ========================= */

    button {

      width: 100%;

      padding: 14px 20px;

      border-radius: 10px;

      border: 1px solid #4775e8;

      background:

        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      color: white;

      font-size: 16px;

      font-weight: 750;

      cursor: pointer;

      box-shadow:

        0 12px 30px
        rgba(61,111,232,.18);

      transition: .2s;

    }


    button:hover {

      transform: translateY(-2px);

      filter: brightness(1.08);

    }


    button:active {

      transform: translateY(0);

    }


    button:disabled {

      opacity: .6;

      cursor: not-allowed;

      transform: none;

      filter: none;

    }


    /* =========================
       MESSAGE
    ========================= */

    #message {

      margin-top: 18px;

      text-align: center;

      font-size: 14px;

      line-height: 1.5;

      color: var(--muted);

    }


    /* =========================
       REGISTER
    ========================= */

    .register {

      margin-top: 25px;

      padding-top: 22px;

      border-top: 1px solid #1a2942;

      text-align: center;

      color: var(--muted);

      font-size: 14px;

    }


    .register a {

      color: #8faeff;

      text-decoration: none;

      font-weight: 700;

      transition: .2s;

    }


    .register a:hover {

      color: var(--blue);

      text-decoration: underline;

    }


    /* =========================
       BACK HOME
    ========================= */

    .back-home {

      display: block;

      text-align: center;

      margin-top: 20px;

      color: var(--muted2);

      font-size: 13px;

      text-decoration: none;

      transition: .2s;

    }


    .back-home:hover {

      color: #aab7ca;

    }


    /* =========================
       DESKTOP
    ========================= */

    @media (width >= 700px) {

      body {

        padding: 50px 30px;

      }


      .container {

        max-width: 480px;

      }


      .card {

        padding: 38px;

      }


      h1 {

        font-size: 30px;

      }

    }


    /* =========================
       TABLET
    ========================= */

    @media (600px <= width < 700px) {

      .container {

        max-width: 450px;

      }

    }


    /* =========================
       CELULAR
    ========================= */

    @media (width < 500px) {

      body {

        padding: 20px 15px;

        align-items: center;

      }


      .logo-area {

        margin-bottom: 20px;

      }


      .logo {

        font-size: 22px;

      }


      .logo-icon {

        width: 38px;

        height: 38px;

        border-radius: 11px;

        font-size: 17px;

      }


      .card {

        padding: 24px 20px;

        border-radius: 16px;

      }


      h1 {

        font-size: 25px;

      }


      .subtitle {

        font-size: 14px;

        margin-bottom: 23px;

      }


      input {

        padding: 13px;

        font-size: 15px;

      }


      button {

        padding: 13px;

      }

    }


    /* =========================
       CELULARES PEQUENOS
    ========================= */

    @media (width < 360px) {

      body {

        padding: 15px 12px;

      }


      .card {

        padding: 21px 17px;

      }


      .logo {

        font-size: 20px;

      }


      h1 {

        font-size: 23px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- LOGO -->

    <div class="logo-area">

      <div class="logo">

        <div class="logo-icon">
          C
        </div>

        <span>
          Conecta ADM
        </span>

      </div>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">


      <h1>
        Entrar
      </h1>


      <p class="subtitle">
        Entre na sua conta do Conecta ADM.
      </p>


      <form id="loginForm">


        <!-- E-MAIL -->

        <div class="field">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- SENHA -->

        <div class="field">

          <label for="password">
            Senha
          </label>

          <input
            id="password"
            type="password"
            placeholder="Sua senha"
            autocomplete="current-password"
            required
          >

        </div>


        <!-- ESQUECI SENHA -->

        <a
          href="#"
          class="forgot"
          id="forgotPassword"
        >
          Esqueci minha senha
        </a>


        <!-- ENTRAR -->

        <button
          type="submit"
          id="loginButton"
        >
          Entrar
        </button>


      </form>


      <!-- MENSAGEM -->

      <div id="message"></div>


      <!-- CADASTRO -->

      <div class="register">

        Ainda não tem uma conta?

        <a href="cadastro.html">
          Criar conta
        </a>

      </div>


    </div>


    <!-- VOLTAR -->

    <a
      href="index.html"
      class="back-home"
    >
      ← Voltar para o início
    </a>


  </div>



  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const { createClient } = supabase;


    const client = createClient(

      window.SUPABASE_URL,

      window.SUPABASE_PUBLISHABLE_KEY

    );


    const form =
      document.getElementById("loginForm");


    const button =
      document.getElementById("loginButton");


    const message =
      document.getElementById("message");


    /* =========================
       LOGIN
    ========================= */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        button.disabled = true;

        button.textContent = "Entrando...";

        message.textContent = "";


        const { data, error } =
          await client.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          message.textContent =
            "Não foi possível entrar: " +
            error.message;


          button.disabled = false;

          button.textContent = "Entrar";

          return;

        }


        if (data.session) {

          window.location.href =
            "dashboard.html";

        }

      }
    );


    /* =========================
       RECUPERAR SENHA
    ========================= */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          if (!email) {

            message.textContent =
              "Digite seu e-mail primeiro.";

            return;

          }


          const { error } =
            await client.auth.resetPasswordForEmail(

              email,

              {

                redirectTo:
                  new URL(
                    "login.html",
                    window.location.href
                  ).href

              }

            );


          if (error) {

            message.textContent =
              "Não foi possível enviar o e-mail: " +
              error.message;

            return;

          }


          message.textContent =
            "Enviamos um e-mail para redefinir sua senha.";

        }
      );

  </script>


</body>

</html>
