<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil profissional | Conecta ADM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
:root{--bg:#080f1d;--panel:#111d32;--line:#2a3d5d;--text:#f3f6fc;--muted:#aab7ca;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}header{padding:18px max(18px,calc((100% - 960px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}a{color:var(--accent);text-decoration:none}main{max-width:960px;margin:32px auto;padding:0 18px}.intro{margin-bottom:24px}.intro p,.hint{color:var(--muted);line-height:1.55}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:0 0 18px}label{display:block;color:#c3cee0;font-weight:700;font-size:13px;margin:13px 0}input,textarea,select{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#091323;color:var(--text);font:inherit}textarea{min-height:95px;resize:vertical}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:9px;padding:12px 16px;background:var(--accent);color:#07101f;font-weight:800;cursor:pointer}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.notice{padding:12px;border-radius:9px;background:#17243a;color:var(--muted);margin:12px 0}.match-list{display:grid;gap:10px}.match{padding:13px;border:1px solid var(--line);border-radius:10px;background:#0b1527}.match strong{display:block;margin-bottom:4px}.match small{color:var(--muted)}.resume-preview{background:#fff;color:#172033;padding:26px;border-radius:10px;min-height:260px}.resume-preview h2{color:#1e3a8a;margin:0 0 8px}.resume-preview h3{font-size:14px;color:#1e3a8a;border-bottom:1px solid #cbd5e1;padding-bottom:5px;margin:18px 0 8px}.resume-preview p{white-space:pre-wrap;line-height:1.45;margin:5px 0}.resume-preview .muted{color:#475569;font-size:13px}.wide{grid-column:1/-1}@media(max-width:700px){.layout{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{@page{size:A4;margin:0}html,body{width:210mm;height:297mm;margin:0!important;padding:0!important;background:white!important;color:#111!important}header,.intro,.layout .card:first-child,.layout .card:nth-child(2),.buttons,.resume-controls,.hint,.card.wide>h2{display:none!important}main{width:210mm!important;height:297mm!important;margin:0!important;padding:0!important;max-width:none!important}.layout{display:block!important;margin:0!important}.card.wide{display:block!important;width:210mm!important;height:297mm!important;border:0!important;border-radius:0!important;padding:0!important;margin:0!important;background:white!important}.resume-preview{display:block!important;width:210mm!important;height:297mm!important;min-height:0!important;padding:0!important;margin:0!important;border-radius:0!important;overflow:visible!important;background:white!important}.preview-frame{width:794px!important;height:1123px!important;overflow:visible!important}.preview-scaled{width:794px!important;transform:none!important}.resume-preview .cv{width:794px!important;height:1123px!important;min-height:1123px!important;margin:0!important;box-shadow:none!important}}
<style>
.resume-preview{padding:0;overflow:hidden;position:relative}.preview-frame{width:100%;overflow:hidden;position:relative}.preview-scaled{width:794px;transform-origin:top left}.resume-preview .cv{width:794px;min-height:1123px;background:#fff;color:#222;font-family:Georgia,serif;padding:42px;--cvcolor:#707987}.resume-preview .cv h1{font-size:30px;letter-spacing:1.8px;margin:0;color:inherit}.resume-preview .cv h2{font-size:17px;letter-spacing:2px;text-transform:uppercase;color:var(--cvcolor);margin:0 0 14px}.resume-preview .cv p,.resume-preview .cv li{font-size:14px;line-height:1.4}.cv .head{display:flex;align-items:center;gap:24px;border-bottom:2px solid #ddd;padding-bottom:22px;margin-bottom:24px}.cv .head h1{max-width:620px;overflow-wrap:anywhere}.cv .grid{grid-template-columns:30% minmax(0,1fr)}.cv .content{min-width:0}.cv .side{min-width:0}.cv .contact p{overflow-wrap:anywhere}.cv .photo{width:86px;height:86px;border-radius:50%;object-fit:cover;border:2px solid #ddd}.cv .grid{display:grid;grid-template-columns:30% 1fr;gap:28px}.cv .side{border-right:2px solid #ddd;padding-right:20px}.cv section{margin:0 0 24px}.cv ul{padding-left:18px}.cv .contact p{overflow-wrap:anywhere}.cv.template2{font-family:Arial,sans-serif;padding:0}.cv.template2 .head{background:var(--cvcolor);color:white;padding:30px 34px;border:0;margin:0;display:block}.cv.template2 .headtop{display:flex;align-items:center;gap:18px}.cv.template2 .photo{border-color:rgba(255,255,255,.35)}.cv.template2 .contactbar{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.3);font-size:13px}.cv.template2 .body{padding:30px 34px}.cv.template2 h2{font-family:Arial,sans-serif;letter-spacing:0;text-transform:none;font-size:22px}.cv.template2 section{border-bottom:1px solid #ddd;padding-bottom:18px}.cv.template2 .side{border:0;padding:0}.template1 .side h2{font-size:16px}.template1 .head h1{font-size:28px}.resume-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.resume-controls select,.resume-controls input{width:auto;margin:0}.resume-controls label{display:flex;align-items:center;gap:8px;margin:0}.resume-controls input[type=color]{width:45px;height:40px;padding:3px}.@media print{.preview-frame{width:794px!important;height:auto!important;overflow:visible!important}.preview-scaled{transform:none!important;width:794px!important}.resume-preview .cv{width:794px!important;min-height:1123px!important}}
</style></style></head><body>
<header><strong>Conecta ADM</strong><a href="editar-perfil.html">← Voltar ao perfil</a></header><main>
<div class="layout">
<section class="card wide"><h2>Escolha o modelo do seu currículo</h2><p class="hint">As informações do seu perfil serão preenchidas automaticamente. Você pode alternar entre os modelos e personalizar a cor do segundo.</p>
<div class="resume-controls"><label>Modelo <select id="template"><option value="template1">Modelo clássico</option><option value="template2">Modelo moderno</option></select></label><label>Cor do cabeçalho <input id="cvcolor" type="color" value="#6b7280"></label></div>
<div id="resume" class="resume-preview"><div class="preview-frame"><div class="preview-scaled"></div></div></div>
<div class="buttons"><button id="print">Baixar / imprimir currículo</button><a class="secondary" href="editar-perfil.html">Voltar ao perfil</a></div><p class="hint">Na janela de impressão, escolha “Salvar como PDF” para baixar.</p></section>
</div></main>
<script>
const client=window.getSupabaseClient();const key="conecta_professional_profile";
let user=null,base={},metadata={};
const $=id=>document.getElementById(id);
function getData(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch{return {}}}
function saveData(data){localStorage.setItem(key,JSON.stringify(data))}
function normalize(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
const jobs=[
{title:"Jovem Aprendiz - Menegazzo Litoral",company:"Distribuidora Menegazzo",type:"Jovem Aprendiz",keywords:"administrativo logística rh financeiro documentos atendimento controles",url:"https://www.netvagas.com.br/empresa/anuncios/a2662085/jovem-aprendiz-menegazzo-litoral-registro-sp/"},
{title:"Jovem Aprendiz - Grupo Águia Branca",company:"Grupo Águia Branca",type:"Jovem Aprendiz",keywords:"atendimento documentos relatórios planilhas informática materiais",url:"https://grupoaguiabranca.empregare.com/pt-br/vaga-jovem-aprendiz-registro-sp_188480"},
{title:"Estágio na área administrativa - UNISA",company:"IEREG",type:"Estágio",keywords:"administrativo redes sociais excel word comunicação",url:"https://vagas.solides.com.br/vaga/945489"},
{title:"Jovem Aprendiz - BBL Engenharia",company:"BBL Engenharia",type:"Jovem Aprendiz",keywords:"administrativo documentos planilhas atendimento informática word excel",url:"https://bbl.gupy.io/job/eyJqb2JJZCI6MTI3OTIwODIsInNvdXJjZSI6Imd1cHlfcG9ydGFsIn0=?jobBoardSource=gupy_portal"},
{title:"Auxiliar Administrativo - Hospital Regional",company:"Hospital Regional",type:"CLT",keywords:"administrativo arquivos agendas atendimento planilhas sistemas ensino médio",url:"https://irssl.gupy.io/job/eyJqb2JJZCI6MTI2ODgwOTMsInNvdXJjZSI6Imd1cHlfcG9ydGFsIn0=?jobBoardSource=gupy_portal"}
];
function formData(){return getData()}
function renderMatches(data){const terms=normalize([data.course,data.skills,data.education].join(" ")).split(/\W+/).filter(w=>w.length>2);const scored=jobs.map(job=>{const text=normalize(job.title+" "+job.type+" "+job.keywords);const matches=terms.filter(t=>text.includes(t));return {...job,score:matches.length,matched:matches}}).sort((a,b)=>b.score-a.score);$("matches").innerHTML=scored.map(j=>'<div class="match"><strong>'+j.title+'</strong><small>'+j.company+' · '+(j.score?j.score+" correspondências":"Compatibilidade não identificada")+'</small><div style="margin-top:9px"><a href="'+j.url+'" target="_blank" rel="noopener">Ver vaga ↗</a></div></div>').join("")}
function esc(v){return String(v||"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function scalePreview(){const frame=$("resume").querySelector(".preview-frame");const scaled=frame?.querySelector(".preview-scaled");if(!frame||!scaled)return;const width=$("resume").clientWidth;const scale=Math.min(width/794,1);scaled.style.transform="scale("+scale+")";frame.style.height=(1123*scale)+"px"}
function renderResume(data){const name=base.full_name||metadata.full_name||metadata.name||user?.email||"Seu nome";const email=base.email||user?.email||"";const phone=base.phone||metadata.phone||"";const city=[base.city,base.state].filter(Boolean).join(", ");const photo=base.avatar_url||metadata.avatar_url||"";const school=base.school||metadata.school||metadata.institution||"";const profileType=base.profile_type||metadata.tipo_de_perfil||metadata.profile_type||"";
const contacts=[phone,email,city].filter(Boolean);const education=[data.education, data.course,school].filter(Boolean);const summary=data.summary||("Estudante "+(data.course||"em busca de oportunidade profissional")+". "+(data.skills?"Habilidades: "+data.skills:"")+" Busco oportunidade para desenvolver conhecimentos e contribuir com a equipe.");
const exp=data.experience||"";const skills=data.skills||"";
const template=$("template").value,color=$("cvcolor").value;
const photoHtml=photo?'<img class="photo" src="'+esc(photo)+'" alt="Foto de perfil">':'';
const title=esc(name);
const common='<div class="head"><div class="headtop">'+photoHtml+'<h1>'+title+'</h1></div><div class="contactbar">'+contacts.map(esc).join(" · ")+'</div></div>';
let html;if(template==="template1"){html='<article class="cv template1" style="--cvcolor:'+color+'"><div class="head">'+photoHtml+'<h1>'+title+'</h1></div><div class="grid"><aside class="side"><section class="contact"><h2>Informações de contato</h2>'+contacts.map(x=>'<p>'+esc(x)+'</p>').join("")+'</section><section>'+(skills?'<h2>Habilidades</h2><ul>'+skills.split(/[\n,;]+/).filter(Boolean).map(x=>'<li>'+esc(x.trim())+'</li>').join("")+'</ul>':'')+'</section></aside><div class="content"><section><h2>Resumo profissional</h2><p>'+esc(summary)+'</p></section><section><h2>Experiência</h2><p>'+esc(exp)+'</p></section><section><h2>Educação</h2><p>'+education.map(esc).join("<br>")+'</p></section></div></div></article>'}else{html='<article class="cv template2" style="--cvcolor:'+color+'">'+common+'<div class="body"><section><h2>Resumo profissional</h2><p>'+esc(summary)+'</p></section><section>'+(skills?'<h2>Habilidades</h2><p>'+skills.split(/[\n,;]+/).filter(Boolean).map(esc).join(" · ")+'</p>':'')+'</p></section><section><h2>Experiência</h2><p>'+esc(exp)+'</p></section><section><h2>Educação</h2><p>'+education.map(esc).join("<br>")+'</p></section></div></article>'}
$("resume").innerHTML='<div class="preview-frame"><div class="preview-scaled">'+html+'</div></div>';scalePreview()}
async function init(){try{const {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){return}user=session.user;const {data:profile}=await client.from("profiles").select("*").eq("id",user.id).maybeSingle();base=profile||{};metadata=user.user_metadata||{};const data=getData();renderResume(data);$("notice").textContent="Currículo preenchido automaticamente com as informações do seu perfil."}catch(e){console.error(e);console.error("Não foi possível carregar seu perfil agora.")}}

$("template").addEventListener("change",()=>renderResume(formData()));$("cvcolor").addEventListener("input",()=>renderResume(formData()));$("print").addEventListener("click",()=>window.print());window.addEventListener("resize",scalePreview);init();
</script></body></html>
