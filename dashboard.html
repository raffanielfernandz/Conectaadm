<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | Conecta ADM</title>

  <style>

    /* =========================
       PALETA CONECTA ADM
    ========================= */

    :root {
      --bg: #070b14;
      --bg2: #0b1120;

      --card: #0d1525;
      --card2: #111c30;

      --line: #1c2b46;

      --blue: #5d8cff;
      --blue2: #3d6fe8;
      --purple: #8b5cf6;

      --text: #f5f7ff;
      --muted: #9aa8bd;
      --muted2: #6f7e95;
    }


    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(61,111,232,.12),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      min-height: 100vh;

      line-height: 1.6;
    }

    button,
    a {
      font-family: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;

      z-index: 900;

      height: 72px;

      background: rgba(7,11,20,.78);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .header-content {
      max-width: 1200px;

      height: 100%;

      margin: auto;

      padding: 0 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 20px;

      font-weight: 800;

      letter-spacing: -.4px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;

      border-radius: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      box-shadow:
        0 8px 25px rgba(61,111,232,.22);

      font-size: 17px;
      font-weight: 900;
    }


    /* =========================
       HEADER BUTTON
    ========================= */

    .logout-top {
      padding: 9px 16px;

      border-radius: 9px;

      border: 1px solid #273853;

      background: rgba(255,255,255,.025);

      color: #dce5f7;

      cursor: pointer;

      transition: .2s;
    }

    .logout-top:hover {
      border-color: #4775e8;

      background: rgba(93,140,255,.08);

      transform: translateY(-1px);
    }


    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1200px;

      margin: auto;

      padding: 50px 24px 70px;
    }


    /* =========================
       WELCOME
    ========================= */

    .welcome {
      margin-bottom: 34px;
    }

    .welcome h1 {
      font-size: clamp(30px, 5vw, 44px);

      line-height: 1.1;

      margin-bottom: 10px;

      letter-spacing: -.8px;
    }

    .welcome h1 span {
      color: var(--blue);
    }

    .welcome p {
      color: var(--muted);

      font-size: 16px;

      max-width: 650px;
    }


    /* =========================
       QUICK CARDS
    ========================= */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-bottom: 34px;
    }

    .quick-card {
      background:
        linear-gradient(
          145deg,
          rgba(17,28,48,.9),
          rgba(13,21,37,.9)
        );

      border: 1px solid var(--line);

      border-radius: 16px;

      padding: 22px;

      transition: .2s;
    }

    .quick-card:hover {
      transform: translateY(-3px);

      border-color: #2c4370;

      box-shadow:
        0 15px 35px rgba(0,0,0,.18);
    }

    .quick-icon {
      width: 42px;
      height: 42px;

      border-radius: 11px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(93,140,255,.10);

      border: 1px solid rgba(93,140,255,.18);

      color: var(--blue);

      font-size: 18px;

      margin-bottom: 15px;
    }

    .quick-card h3 {
      font-size: 17px;

      margin-bottom: 6px;
    }

    .quick-card p {
      color: var(--muted);

      font-size: 14px;
    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 23px;

      margin-bottom: 5px;
    }

    .section-title p {
      color: var(--muted2);

      font-size: 14px;
    }


    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      background:
        linear-gradient(
          145deg,
          rgba(17,28,48,.96),
          rgba(10,17,30,.96)
        );

      border: 1px solid var(--line);

      border-radius: 18px;

      padding: 26px;

      margin-bottom: 42px;

      position: relative;

      overflow: hidden;
    }

    .profile-card::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      top: -180px;
      right: -120px;

      background:
        radial-gradient(
          circle,
          rgba(93,140,255,.10),
          transparent 65%
        );

      pointer-events: none;
    }

    .profile-top {
      display: flex;

      align-items: center;

      gap: 18px;

      margin-bottom: 26px;
    }

    .avatar {
      width: 70px;
      height: 70px;

      border-radius: 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      color: white;

      font-size: 28px;

      font-weight: 800;

      flex-shrink: 0;

      box-shadow:
        0 12px 30px rgba(61,111,232,.18);
    }

    .profile-name {
      font-size: 23px;

      font-weight: 750;

      margin-bottom: 3px;
    }

    .profile-email {
      color: var(--muted);

      font-size: 14px;
    }


    /* =========================
       PROFILE DATA
    ========================= */

    .profile-info {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 14px;
    }

    .info-box {
      background: rgba(7,11,20,.45);

      border: 1px solid #1b2b46;

      border-radius: 12px;

      padding: 15px;
    }

    .info-label {
      display: block;

      color: var(--muted2);

      font-size: 12px;

      margin-bottom: 4px;

      text-transform: uppercase;

      letter-spacing: .5px;
    }

    .info-value {
      color: var(--text);

      font-size: 15px;

      font-weight: 600;

      word-break: break-word;
    }


    /* =========================
       DEVELOPMENT CARDS
    ========================= */

    .development-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .development-card {
      background: var(--card);

      border: 1px solid var(--line);

      border-radius: 16px;

      padding: 22px;

      position: relative;

      overflow: hidden;

      transition: .2s;
    }

    .development-card:hover {
      transform: translateY(-2px);

      border-color: #2b4270;
    }

    .development-icon {
      width: 44px;
      height: 44px;

      border-radius: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(93,140,255,.08);

      border: 1px solid rgba(93,140,255,.15);

      color: var(--blue);

      margin-bottom: 15px;

      font-size: 19px;
    }

    .development-card h3 {
      font-size: 17px;

      margin-bottom: 7px;
    }

    .development-card p {
      color: var(--muted);

      font-size: 14px;

      margin-bottom: 15px;
    }

    .status {
      display: inline-flex;

      align-items: center;

      padding: 5px 9px;

      border-radius: 7px;

      background: rgba(93,140,255,.08);

      border: 1px solid rgba(93,140,255,.14);

      color: #8faeff;

      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .4px;
    }


    /* =========================
       BOTTOM LOGOUT
    ========================= */

    .logout-area {
      margin-top: 42px;

      display: flex;

      justify-content: center;
    }

    .logout-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 13px 21px;

      border-radius: 10px;

      background: transparent;

      color: #dce5f7;

      font-weight: 700;

      border: 1px solid #263853;

      cursor: pointer;

      transition: .2s;
    }

    .logout-button:hover {
      border-color: #4775e8;

      background: rgba(93,140,255,.08);

      transform: translateY(-2px);
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;

      padding: 100px 20px;

      color: var(--muted);
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #142238;

      padding: 25px 20px;

      text-align: center;

      color: #66768e;

      font-size: 13px;
    }

    footer strong {
      color: #8494ac;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {

      .quick-grid {
        grid-template-columns: 1fr;
      }

      .development-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 600px) {

      header {
        height: 64px;
      }

      .header-content {
        padding: 0 16px;
      }

      main {
        padding: 35px 16px 55px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {
        width: 33px;
        height: 33px;
      }

      .welcome h1 {
        font-size: 31px;
      }

      .profile-card {
        padding: 20px;
      }

      .profile-top {
        align-items: flex-start;
      }

      .avatar {
        width: 58px;
        height: 58px;

        border-radius: 15px;

        font-size: 23px;
      }

      .profile-name {
        font-size: 19px;
      }

      .profile-info {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-content">

      <a href="index.html" class="logo">

        <div class="logo-icon">
          C
        </div>

        <span>Conecta ADM</span>

      </a>


      <button
        class="logout-top"
        id="logoutTop"
      >
        Sair
      </button>

    </div>

  </header>



  <!-- =========================
       MAIN
  ========================= -->

  <main id="mainContent">

    <div class="loading">
      Carregando seu painel...
    </div>

  </main>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <strong>Conecta ADM</strong>

    <br>

    Conectando estudantes, empresas e instituições.

  </footer>



  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <script>

    const client = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================
       ELEMENTOS
    ========================= */

    const mainContent =
      document.getElementById("mainContent");

    const logoutTop =
      document.getElementById("logoutTop");


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

      await client.auth.signOut();

      window.location.href = "index.html";

    }

    logoutTop.addEventListener(
      "click",
      logout
    );


    /* =========================
       CARREGAR DASHBOARD
    ========================= */

    async function loadDashboard() {

      try {

        /*
          Verifica o usuário autenticado.
        */

        const {
          data: {
            user
          },
          error: userError
        } = await client.auth.getUser();


        if (userError || !user) {

          window.location.href = "login.html";

          return;

        }


        /*
          Busca os dados do perfil.
        */

        const {
          data: profile,
          error: profileError
        } = await client
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .single();


        if (profileError) {

          console.error(
            "Erro ao buscar perfil:",
            profileError
          );

          mainContent.innerHTML = `

            <div class="loading">

              <h2>
                Não foi possível carregar seu perfil.
              </h2>

              <p style="margin-top:10px;">
                Tente atualizar a página.
              </p>

            </div>

          `;

          return;

        }


        /*
          Nome para o avatar.
        */

        const fullName =
          profile?.full_name ||
          user.email?.split("@")[0] ||
          "Usuário";


        const firstLetter =
          fullName
            .trim()
            .charAt(0)
            .toUpperCase();


        /*
          Dados do perfil.
        */

        const email =
          profile?.email ||
          user.email ||
          "Não informado";


        const profileType =
          profile?.profile_type ||
          "Não informado";


        const phone =
          profile?.phone ||
          "Não informado";


        const state =
          profile?.state ||
          "Não informado";


        const city =
          profile?.city ||
          "Não informado";


        /*
          Traduz alguns tipos de perfil.
        */

        let typeLabel = profileType;


        if (profileType === "student") {
          typeLabel = "Estudante";
        }

        if (profileType === "empresa") {
          typeLabel = "Empresa";
        }

        if (profileType === "institution") {
          typeLabel = "Instituição";
        }


        /* =========================
           HTML DO DASHBOARD
        ========================= */

        mainContent.innerHTML = `

          <!-- WELCOME -->

          <section class="welcome">

            <h1>
              Olá, <span>${escapeHTML(fullName)}</span> 👋
            </h1>

            <p>
              Bem-vindo ao seu espaço no Conecta ADM.
              Aqui você poderá acompanhar seu perfil,
              oportunidades e seu desenvolvimento.
            </p>

          </section>


          <!-- QUICK CARDS -->

          <section class="quick-grid">


            <div class="quick-card">

              <div class="quick-icon">
                👤
              </div>

              <h3>
                Meu perfil
              </h3>

              <p>
                Consulte suas informações
                cadastradas na plataforma.
              </p>

            </div>


            <div class="quick-card">

              <div class="quick-icon">
                💼
              </div>

              <h3>
                Oportunidades
              </h3>

              <p>
                Em breve você poderá encontrar
                oportunidades profissionais.
              </p>

            </div>


            <div class="quick-card">

              <div class="quick-icon">
                🚀
              </div>

              <h3>
                Desenvolvimento
              </h3>

              <p>
                Acompanhe conteúdos e recursos
                para sua evolução profissional.
              </p>

            </div>


          </section>



          <!-- PROFILE -->

          <section>

            <div class="section-title">

              <h2>
                Meu perfil
              </h2>

              <p>
                Confira as informações da sua conta.
              </p>

            </div>


            <div class="profile-card">


              <div class="profile-top">


                <div class="avatar">

                  ${escapeHTML(firstLetter)}

                </div>


                <div>

                  <div class="profile-name">

                    ${escapeHTML(fullName)}

                  </div>

                  <div class="profile-email">

                    ${escapeHTML(email)}

                  </div>

                </div>


              </div>



              <div class="profile-info">


                <div class="info-box">

                  <span class="info-label">
                    Tipo de perfil
                  </span>

                  <span class="info-value">
                    ${escapeHTML(typeLabel)}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Telefone
                  </span>

                  <span class="info-value">
                    ${escapeHTML(phone)}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Estado
                  </span>

                  <span class="info-value">
                    ${escapeHTML(state)}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Cidade
                  </span>

                  <span class="info-value">
                    ${escapeHTML(city)}
                  </span>

                </div>


              </div>


            </div>

          </section>



          <!-- DEVELOPMENT -->

          <section>


            <div class="section-title">

              <h2>
                O que vem por aí
              </h2>

              <p>
                Novos recursos estão sendo
                preparados para o Conecta ADM.
              </p>

            </div>


            <div class="development-grid">


              <div class="development-card">

                <div class="development-icon">
                  💼
                </div>

                <h3>
                  Oportunidades
                </h3>

                <p>
                  Encontre vagas, estágios e
                  oportunidades alinhadas ao
                  seu perfil.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>



              <div class="development-card">

                <div class="development-icon">
                  📚
                </div>

                <h3>
                  Conteúdos
                </h3>

                <p>
                  Acesse conteúdos para desenvolver
                  suas habilidades profissionais.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>



              <div class="development-card">

                <div class="development-icon">
                  🤝
                </div>

                <h3>
                  Conexões
                </h3>

                <p>
                  Conecte-se com empresas,
                  estudantes e instituições.
                </p>

                <span class="status">
                                    Em desenvolvimento
                </span>

              </div>



              <div class="development-card">

                <div class="development-icon">
                  📚
                </div>

                <h3>
                  Conteúdos
                </h3>

                <p>
                  Acesse conteúdos para desenvolver
                  suas habilidades profissionais.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>



              <div class="development-card">

                <div class="development-icon">
                  🤝
                </div>

                <h3>
                  Conexões
                </h3>

                <p>
                  Conecte-se com empresas,
                  estudantes e instituições.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>



              <div class="development-card">

                <div class="development-icon">
                  🚀
                </div>

                <h3>
                  Desenvolvimento
                </h3>

                <p>
                  Acompanhe sua evolução e
                  descubra novos caminhos profissionais.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>


            </div>


          </section>



          <!-- LOGOUT -->

          <div class="logout-area">

            <button
              class="logout-button"
              id="logoutBottom"
            >

              Sair da conta

            </button>

          </div>

        `;


        /*
          Ativa o segundo botão de logout.
        */

        document
          .getElementById("logoutBottom")
          .addEventListener(
            "click",
            logout
          );


      } catch (error) {

        console.error(error);

        mainContent.innerHTML = `

          <div class="loading">

            <h2>
              Ocorreu um erro.
            </h2>

            <p style="margin-top:10px;">
              Tente atualizar a página.
            </p>

          </div>

        `;

      }

    }


    /* =========================
       SEGURANÇA CONTRA HTML
    ========================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       INICIAR
    ========================= */

    loadDashboard();

  </script>


</body>

</html>
