<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta ADM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body style="background:#080f1d;color:#f4f7fb;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh">
  <p>Carregando oportunidades...</p>
  <script>
    const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
    client.auth.getSession().then(({data}) => {
      window.location.replace(data.session ? "vagas.html" : "login.html");
    });
  </script>
</body>
</html>
