<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard • Conecta ADM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>


  <style>

    :root{
      --bg:#070b14;
      --bg2:#0b1120;
      --card:#0d1525;
      --card2:#111c30;
      --line:#1c2b46;

      --blue:#5d8cff;
      --blue2:#3d6fe8;
      --purple:#8b5cf6;

      --text:#f5f7ff;
      --muted:#9aa8bd;
      --muted2:#6f7e95;
    }


    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }


    body{

      font-family:Arial,Helvetica,sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(61,111,232,.12),
          transparent 35%
        ),
        var(--bg);

      color:var(--text);

      min-height:100vh;

      line-height:1.6;

    }


    header{

      position:sticky;

      top:0;

      z-index:900;

      background:rgba(7,11,20,.78);

      backdrop-filter:blur(14px);

      border-bottom:1px solid rgba(255,255,255,.05);

    }


    .header-inner{

      width:min(1100px,92%);

      height:70px;

      margin:auto;

      display:flex;

      align-items:center;

      justify-content:space-between;

    }


    .logo{

      color:white;

      text-decoration:none;

      font-size:22px;

      font-weight:800;

    }


    .logout-top{

      border:1px solid #263853;

      background:transparent;

      color:#dce5f7;

      padding:9px 14px;

      border-radius:9px;

      font-weight:700;

      cursor:pointer;

      transition:.2s;

    }


    .logout-top:hover{

      border-color:#4775e8;

      background:rgba(93,140,255,.08);

    }


    main{

      width:min(1100px,92%);

      margin:40px auto 70px;

    }


    .welcome{

      margin-bottom:28px;

    }


    .welcome h1{

      font-size:30px;

      margin-bottom:5px;

    }


    .welcome p{

      color:var(--muted);

      font-size:15px;

    }


    .profile-card{

      background:
        linear-gradient(
          145deg,
          rgba(17,28,48,.96),
          rgba(10,17,30,.96)
        );

      border:1px solid #203452;

      border-radius:18px;

      padding:25px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.25);

      margin-bottom:35px;

    }


    .profile-header{

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:15px;

      margin-bottom:25px;

    }


    .profile-header h2{

      font-size:21px;

    }


    .edit-profile-button{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      padding:9px 13px;

      border-radius:9px;

      border:1px solid #263853;

      background:rgba(255,255,255,.025);

      color:#dce5f7;

      text-decoration:none;

      font-size:13px;

      font-weight:700;

      transition:.2s;

      white-space:nowrap;

    }


    .edit-profile-button:hover{

      border-color:#4775e8;

      background:rgba(93,140,255,.08);

    }


    .profile-main{

      display:flex;

      align-items:center;

      gap:18px;

      margin-bottom:25px;

    }


    .avatar{

      width:64px;

      height:64px;

      flex-shrink:0;

      border-radius:50%;

      display:flex;

      align-items:center;

      justify-content:center;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      color:white;

      font-size:22px;

      font-weight:800;

    }


    .profile-name{

      font-size:19px;

      font-weight:800;

      margin-bottom:2px;

    }


    .profile-email{

      color:var(--muted);

      font-size:14px;

      word-break:break-word;

    }


    .profile-grid{

      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:12px;

    }


    .info-box{

      background:
        rgba(255,255,255,.025);

      border:1px solid #1c2b46;

      border-radius:12px;

      padding:15px;

      min-width:0;

    }


    .info-label{

      color:var(--muted2);

      font-size:12px;

      font-weight:700;

      text-transform:uppercase;

      letter-spacing:.4px;

      margin-bottom:4px;

    }


    .info-value{

      color:#edf2ff;

      font-size:14px;

      font-weight:700;

      word-break:break-word;

    }


    .coming-title{

      font-size:21px;

      margin-bottom:17px;

    }


    .coming-grid{

      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:14px;

    }


    .coming-card{

      background:#0d1525;

      border:1px solid #1c2b46;

      border-radius:14px;

      padding:20px;

      min-height:145px;

    }


    .coming-card h3{

      font-size:16px;

      margin-bottom:7px;

    }


    .coming-card p{

      color:var(--muted);

      font-size:13px;

    }


    .status{

      display:inline-block;

      margin-top:15px;

      padding:5px 9px;

      border-radius:7px;

      background:rgba(93,140,255,.08);

      border:1px solid rgba(93,140,255,.16);

      color:#9db7ff;

      font-size:11px;

      font-weight:700;

    }


    .logout-bottom{

      margin-top:35px;

      width:100%;

      min-height:46px;

      border-radius:10px;

      border:1px solid #263853;

      background:transparent;

      color:#dce5f7;

      font-size:14px;

      font-weight:750;

      cursor:pointer;

      transition:.2s;

    }


    .logout-bottom:hover{

      border-color:#4775e8;

      background:rgba(93,140,255,.08);

    }


    footer{

      border-top:1px solid #142238;

      padding:25px 20px;

      text-align:center;

      color:#66768e;

      font-size:13px;

    }


    .loading{

      text-align:center;

      color:var(--muted);

      padding:80px 20px;

    }


    @media(max-width:850px){

      .coming-grid{

        grid-template-columns:
          repeat(2,minmax(0,1fr));

      }

    }


    @media(max-width:600px){

      main{

        margin-top:28px;

      }


      .welcome h1{

        font-size:25px;

      }


      .profile-card{

        padding:19px;

      }


      .profile-header{

        align-items:flex-start;

      }


      .profile-main{

        align-items:flex-start;

      }


      .profile-grid{

        grid-template-columns:1fr;

      }


      .coming-grid{

        grid-template-columns:1fr;

      }


      .edit-profile-button{

        font-size:12px;

        padding:8px 10px;

      }

    }

  </style>

</head>


<body>


  <header>

    <div class="header-inner">

      <a
        href="index.html"
        class="logo"
      >
        Conecta ADM
      </a>


      <button
        class="logout-top"
        id="logoutTop"
      >
        Sair
      </button>

    </div>

  </header>


  <main id="mainContent">

    <div class="loading">

      Carregando seu dashboard...

    </div>

  </main>


  <footer>

    © 2026 Conecta ADM • Projeto acadêmico

  </footer>


  <script>


    const client =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
      );


    const mainContent =
      document.getElementById(
        "mainContent"
      );


    async function logout(){

      await client.auth.signOut();

      window.location.href =
        "index.html";

    }


    document
      .getElementById("logoutTop")
      .addEventListener(
        "click",
        logout
      );


    function formatPhone(value){

      const numbers =
        String(value || "")
          .replace(/\D/g,"")
          .substring(0,11);


      if(!numbers){

        return "Não informado";

      }


      if(numbers.length <= 2){

        return "(" + numbers;

      }


      if(numbers.length <= 7){

        return "(" +
          numbers.substring(0,2) +
          ") " +
          numbers.substring(2);

      }


      return "(" +
        numbers.substring(0,2) +
        ") " +
        numbers.substring(2,7) +
        "-" +
        numbers.substring(7);

    }


    function profileTypeLabel(type){

      if(type === "student"){

        return "Estudante";

      }


      if(type === "empresa"){

        return "Empresa";

      }


      if(
        type === "institution" ||
        type === "escola"
      ){

        return "Instituição";

      }


      return type || "Não informado";

    }


    function valueOrDefault(value){

      if(
        value === null ||
        value === undefined ||
        String(value).trim() === ""
      ){

        return "Não informado";

      }


      return escapeHTML(
        String(value)
      );

    }


    function createInfoBox(
      label,
      value
    ){

      return `

        <div class="info-box">

          <div class="info-label">
            ${label}
          </div>

          <div class="info-value">
            ${value}
          </div>

        </div>

      `;

    }


    async function loadDashboard(){

      try{


        const {

          data:{
            user

          },

          error:userError

        } =
          await client.auth.getUser();


        if(
          userError ||
          !user
        ){

          window.location.href =
            "login.html";

          return;

        }


        const {

          data:profile,

          error:profileError

        } =
          await client

            .from("profiles")

            .select("*")

            .eq("id",user.id)

            .single();


        if(profileError){

          throw profileError;

        }


        const type =
          profile.profile_type;


        const typeLabel =
          profileTypeLabel(type);


        const fullName =
          profile.full_name ||
          user.user_metadata?.full_name ||
          "Usuário";


        let profileInfos = "";


        /*
          Informações gerais
        */


        profileInfos +=
          createInfoBox(
            "Tipo de perfil",
            escapeHTML(typeLabel)
          );


        profileInfos +=
          createInfoBox(
            "Telefone",
            formatPhone(
              profile.phone
            )
          );


        profileInfos +=
          createInfoBox(
            "Estado",
            valueOrDefault(
              profile.state
            )
          );


        profileInfos +=
          createInfoBox(
            "Cidade",
            valueOrDefault(
              profile.city
            )
          );


        /*
          Informações específicas
          do tipo de perfil
        */


        if(type === "student"){

          profileInfos +=
            createInfoBox(
              "Escola / Faculdade",
              valueOrDefault(
                profile.school
              )
            );

        }


        else if(type === "empresa"){

          profileInfos +=
            createInfoBox(
              "Empresa",
              valueOrDefault(
                profile.company_name
              )
            );


          profileInfos +=
            createInfoBox(
              "Segmento",
              valueOrDefault(
                profile.segment
              )
            );

        }


        else if(
          type === "institution" ||
          type === "escola"
        ){

          profileInfos +=
            createInfoBox(
              "Instituição",
              valueOrDefault(
                profile.institution_name
              )
            );


          profileInfos +=
            createInfoBox(
              "Tipo de instituição",
              valueOrDefault(
                profile.institution_type
              )
            );

        }


        /*
          Avatar
        */


        const firstLetter =
          String(fullName)
            .trim()
            .charAt(0)
            .toUpperCase();


        mainContent.innerHTML = `

          <div class="welcome">

            <h1>
              Olá, ${escapeHTML(fullName)} 👋
            </h1>

            <p>
              Bem-vindo ao seu espaço no Conecta ADM.
            </p>

          </div>


          <section class="profile-card">

            <div class="profile-header">

              <h2>
                Meu perfil
              </h2>


              <a
                href="editar-perfil.html"
                class="edit-profile-button"
              >
                ✏️ Editar perfil
              </a>

            </div>


            <div class="profile-main">

              <div class="avatar">
                ${escapeHTML(firstLetter)}
              </div>


              <div>

                <div class="profile-name">
                  ${escapeHTML(fullName)}
                </div>


                <div class="profile-email">
                  ${escapeHTML(
                    profile.email ||
                    user.email ||
                    ""
                  )}
                </div>

              </div>

            </div>


            <div class="profile-grid">

              ${profileInfos}

            </div>

          </section>


          <section>

            <h2 class="coming-title">
              O que vem por aí
            </h2>


            <div class="coming-grid">


              <div class="coming-card">

                <h3>
                  Oportunidades
                </h3>

                <p>
                  Encontre oportunidades
                  de estágio e trabalho.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>


              <div class="coming-card">

                <h3>
                  Conteúdos
                </h3>

                <p>
                  Conteúdos para ajudar
                  no seu desenvolvimento.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>


              <div class="coming-card">

                <h3>
                  Conexões
                </h3>

                <p>
                  Conecte-se com pessoas,
                  empresas e instituições.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>


              <div class="coming-card">

                <h3>
                  Desenvolvimento
                </h3>

                <p>
                  Acompanhe sua evolução
                  profissional e acadêmica.
                </p>

                <span class="status">
                  Em desenvolvimento
                </span>

              </div>


            </div>


            <button
              class="logout-bottom"
              id="logoutBottom"
            >
              Sair da conta
            </button>


          </section>

        `;


        document
          .getElementById(
            "logoutBottom"
          )
          .addEventListener(
            "click",
            logout
          );


      }


      catch(error){

        console.error(error);


        mainContent.innerHTML = `

          <div class="loading">

            <h2>
              Ocorreu um erro.
            </h2>

            <p style="margin-top:10px;">
              Tente atualizar a página.
            </p>

          </div>

        `;

      }

    }


    function escapeHTML(value){

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    loadDashboard();


  </script>


</body>

</html>
