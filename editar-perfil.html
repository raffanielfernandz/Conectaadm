<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Editar perfil • Conecta ADM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <style>

    :root{
      --bg:#070b14;
      --bg2:#0b1120;
      --card:#0d1525;
      --card2:#111c30;
      --line:#1c2b46;

      --blue:#5d8cff;
      --blue2:#3d6fe8;
      --purple:#8b5cf6;

      --text:#f5f7ff;
      --muted:#9aa8bd;
      --muted2:#6f7e95;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{

      font-family:Arial,Helvetica,sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(61,111,232,.12),
          transparent 35%
        ),
        var(--bg);

      color:var(--text);

      min-height:100vh;

      line-height:1.6;

    }

    header{

      position:sticky;

      top:0;

      z-index:900;

      background:rgba(7,11,20,.78);

      backdrop-filter:blur(14px);

      border-bottom:1px solid rgba(255,255,255,.05);

    }

    .header-inner{

      width:min(1100px,92%);

      margin:auto;

      height:72px;

      display:flex;

      align-items:center;

      justify-content:space-between;

    }

    .logo{

      font-size:22px;

      font-weight:800;

      color:white;

      text-decoration:none;

    }

    .back{

      color:#cbd6ea;

      text-decoration:none;

      font-weight:600;

      font-size:14px;

      padding:9px 13px;

      border:1px solid #263853;

      border-radius:9px;

      transition:.2s;

    }

    .back:hover{

      border-color:#4775e8;

      background:rgba(93,140,255,.08);

    }

    main{

      width:min(680px,92%);

      margin:45px auto 70px;

    }

    .title{

      margin-bottom:25px;

    }

    .title h1{

      font-size:30px;

      margin-bottom:7px;

    }

    .title p{

      color:var(--muted);

      font-size:15px;

    }

    .card{

      background:
        linear-gradient(
          145deg,
          rgba(17,28,48,.96),
          rgba(10,17,30,.96)
        );

      border:1px solid #203452;

      border-radius:18px;

      padding:25px;

      box-shadow:0 20px 60px rgba(0,0,0,.25);

    }

    .field{

      margin-bottom:19px;

    }

    label{

      display:block;

      font-size:14px;

      font-weight:700;

      margin-bottom:7px;

      color:#dce5f7;

    }

    input,
    select{

      width:100%;

      padding:13px 14px;

      border-radius:10px;

      border:1px solid #263853;

      background:#0a111e;

      color:white;

      outline:none;

      font-size:15px;

      transition:.2s;

    }

    input:focus,
    select:focus{

      border-color:#4775e8;

      box-shadow:0 0 0 3px rgba(93,140,255,.10);

    }

    input:disabled{

      opacity:.6;

      cursor:not-allowed;

    }

    select{

      appearance:auto;

    }

    option{

      background:#0a111e;

      color:white;

    }

    .profile-specific{

      display:none;

      margin-top:5px;

      padding-top:20px;

      border-top:1px solid #1c2b46;

    }

    .profile-specific.active{

      display:block;

    }

    .section-title{

      font-size:16px;

      font-weight:800;

      margin-bottom:18px;

      color:#f5f7ff;

    }

    .actions{

      display:flex;

      gap:12px;

      margin-top:27px;

    }

    button,
    .cancel{

      flex:1;

      min-height:46px;

      border-radius:10px;

      font-size:15px;

      font-weight:750;

      cursor:pointer;

      text-decoration:none;

      display:flex;

      align-items:center;

      justify-content:center;

      transition:.2s;

    }

    .cancel{

      border:1px solid #263853;

      color:#dce5f7;

      background:transparent;

    }

    .cancel:hover{

      background:rgba(255,255,255,.04);

    }

    button{

      border:1px solid #4775e8;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      color:white;

      box-shadow:0 12px 30px rgba(61,111,232,.18);

    }

    button:hover{

      transform:translateY(-1px);

      filter:brightness(1.08);

    }

    button:disabled{

      opacity:.6;

      cursor:not-allowed;

      transform:none;

    }

    .message{

      margin-top:18px;

      padding:12px 14px;

      border-radius:10px;

      display:none;

      font-size:14px;

    }

    .message.success{

      display:block;

      background:rgba(34,197,94,.10);

      border:1px solid rgba(34,197,94,.25);

      color:#86efac;

    }

    .message.error{

      display:block;

      background:rgba(239,68,68,.10);

      border:1px solid rgba(239,68,68,.25);

      color:#fca5a5;

    }

    .loading{

      text-align:center;

      color:var(--muted);

      padding:60px 20px;

    }

    @media(max-width:600px){

      main{

        margin-top:30px;

      }

      .card{

        padding:20px;

      }

      .title h1{

        font-size:26px;

      }

      .actions{

        flex-direction:column-reverse;

      }

    }

  </style>

</head>

<body>

  <header>

    <div class="header-inner">

      <a href="index.html" class="logo">
        Conecta ADM
      </a>

      <a href="dashboard.html" class="back">
        ← Voltar
      </a>

    </div>

  </header>


  <main>

    <div class="title">

      <h1>Editar perfil</h1>

      <p>
        Complete ou atualize suas informações.
      </p>

    </div>


    <div id="loading" class="loading">

      Carregando seu perfil...

    </div>


    <div id="content" style="display:none;">

      <div class="card">

        <form id="profileForm">


          <div class="field">

            <label for="fullName">
              Nome completo
            </label>

            <input
              type="text"
              id="fullName"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="email">
              E-mail
            </label>

            <input
              type="email"
              id="email"
              disabled
            >

          </div>


          <div class="field">

            <label for="phone">
              Telefone
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="(11) 12345-6789"
              maxlength="15"
              inputmode="numeric"
            >

          </div>


          <div class="field">

            <label for="state">
              Estado
            </label>

            <select id="state">

              <option value="">
                Selecione seu estado
              </option>

              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>

            </select>

          </div>


          <div class="field">

            <label for="city">
              Cidade
            </label>

            <input
              type="text"
              id="city"
              placeholder="Ex.: Registro"
            >

          </div>


          <!-- ESTUDANTE -->

          <div
            id="studentFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações acadêmicas
            </div>

            <div class="field">

              <label for="school">
                Escola / Faculdade
              </label>

              <input
                type="text"
                id="school"
                placeholder="Nome da escola ou faculdade"
              >

            </div>

          </div>


          <!-- EMPRESA -->

          <div
            id="companyFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações da empresa
            </div>

            <div class="field">

              <label for="companyName">
                Nome da empresa
              </label>

              <input
                type="text"
                id="companyName"
                placeholder="Nome da empresa"
              >

            </div>


            <div class="field">

              <label for="segment">
                Segmento
              </label>

              <input
                type="text"
                id="segment"
                placeholder="Ex.: Tecnologia"
              >

            </div>

          </div>


          <!-- INSTITUIÇÃO -->

          <div
            id="institutionFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações da instituição
            </div>

            <div class="field">

              <label for="institutionName">
                Nome da instituição
              </label>

              <input
                type="text"
                id="institutionName"
                placeholder="Nome da instituição"
              >

            </div>


            <div class="field">

              <label for="institutionType">
                Tipo de instituição
              </label>

              <input
                type="text"
                id="institutionType"
                placeholder="Ex.: Escola, Faculdade, Universidade"
              >

            </div>

          </div>


          <div class="actions">

            <a
              href="dashboard.html"
              class="cancel"
            >
              Cancelar
            </a>

            <button
              type="submit"
              id="saveButton"
            >
              Salvar alterações
            </button>

          </div>


          <div
            id="message"
            class="message"
          ></div>


        </form>

      </div>

    </div>

  </main>


  <script>

    const client =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
      );


    const loading =
      document.getElementById("loading");

    const content =
      document.getElementById("content");

    const form =
      document.getElementById("profileForm");

    const message =
      document.getElementById("message");

    const saveButton =
      document.getElementById("saveButton");


    const fullNameInput =
      document.getElementById("fullName");

    const emailInput =
      document.getElementById("email");

    const phoneInput =
      document.getElementById("phone");

    const stateInput =
      document.getElementById("state");

    const cityInput =
      document.getElementById("city");


    const studentFields =
      document.getElementById("studentFields");

    const companyFields =
      document.getElementById("companyFields");

    const institutionFields =
      document.getElementById("institutionFields");


    const schoolInput =
      document.getElementById("school");

    const companyNameInput =
      document.getElementById("companyName");

    const segmentInput =
      document.getElementById("segment");

    const institutionNameInput =
      document.getElementById("institutionName");

    const institutionTypeInput =
      document.getElementById("institutionType");


    let currentUser = null;

    let profileType = null;


    function formatPhone(value){

      let numbers =
        value.replace(/\D/g,"");

      numbers =
        numbers.substring(0,11);


      if(numbers.length <= 2){

        return numbers
          ? "(" + numbers
          : "";

      }


      if(numbers.length <= 7){

        return "(" +
          numbers.substring(0,2) +
          ") " +
          numbers.substring(2);

      }


      return "(" +
        numbers.substring(0,2) +
        ") " +
        numbers.substring(2,7) +
        "-" +
        numbers.substring(7);

    }


    phoneInput.addEventListener(
      "input",
      () => {

        phoneInput.value =
          formatPhone(
            phoneInput.value
          );

      }
    );


    function showSpecificFields(type){

      studentFields.classList.remove("active");

      companyFields.classList.remove("active");

      institutionFields.classList.remove("active");


      if(type === "student"){

        studentFields.classList.add("active");

      }

      else if(type === "empresa"){

        companyFields.classList.add("active");

      }

      else if(type === "institution"){

        institutionFields.classList.add("active");

      }

    }


    function showMessage(
      text,
      type
    ){

      message.textContent = text;

      message.className =
        "message " + type;

    }


    async function loadProfile(){

      try{

        const {
          data: {
            user
          },
          error: userError
        } =
          await client.auth.getUser();


        if(
          userError ||
          !user
        ){

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;


        const {
          data: profile,
          error: profileError
        } =
          await client
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();


        if(profileError){

          throw profileError;

        }


        profileType =
          profile.profile_type;


        fullNameInput.value =
          profile.full_name || "";


        emailInput.value =
          profile.email ||
          user.email ||
          "";


        phoneInput.value =
          formatPhone(
            profile.phone || ""
          );


        stateInput.value =
          profile.state || "";


        cityInput.value =
          profile.city || "";


        schoolInput.value =
          profile.school || "";


        companyNameInput.value =
          profile.company_name || "";


        segmentInput.value =
          profile.segment || "";


        institutionNameInput.value =
          profile.institution_name || "";


        institutionTypeInput.value =
          profile.institution_type || "";


        showSpecificFields(
          profileType
        );


        loading.style.display =
          "none";

        content.style.display =
          "block";


      }catch(error){

        console.error(error);

        loading.innerHTML = `
          <p>
            Não foi possível carregar seu perfil.
          </p>
        `;

      }

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Salvando...";


        message.className =
          "message";


        try{

          const updatedData = {

            full_name:
              fullNameInput.value.trim(),

            phone:
              phoneInput.value.trim(),

            state:
              stateInput.value,

            city:
              cityInput.value.trim(),

            school:
              schoolInput.value.trim(),

            company_name:
              companyNameInput.value.trim(),

            segment:
              segmentInput.value.trim(),

            institution_name:
              institutionNameInput.value.trim(),

            institution_type:
              institutionTypeInput.value.trim(),

            updated_at:
              new Date().toISOString()

          };


          const {
            error
          } =
            await client
              .from("profiles")
              .update(updatedData)
              .eq("id", currentUser.id);


          if(error){

            throw error;

          }


          showMessage(
            "Perfil atualizado com sucesso! ✅",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "dashboard.html";

            },
            900
          );


        }catch(error){

          console.error(error);

          showMessage(
            "Não foi possível salvar as alterações. Tente novamente.",
            "error"
          );


          saveButton.disabled =
            false;

          saveButton.textContent =
            "Salvar alterações";

        }

      }
    );


    loadProfile();

  </script>

</body>

</html>
