<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Editar perfil • Conecta ADM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <style>

    :root{
      --bg:#070b14;
      --bg2:#0b1120;
      --card:#0d1525;
      --card2:#111c30;
      --line:#1c2b46;

      --blue:#5d8cff;
      --blue2:#3d6fe8;
      --purple:#8b5cf6;

      --text:#f5f7ff;
      --muted:#9aa8bd;
      --muted2:#6f7e95;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{

      font-family:Arial,Helvetica,sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(61,111,232,.12),
          transparent 35%
        ),
        var(--bg);

      color:var(--text);

      min-height:100vh;

      line-height:1.6;

    }

    header{

      position:sticky;

      top:0;

      z-index:900;

      background:rgba(7,11,20,.78);

      backdrop-filter:blur(14px);

      border-bottom:1px solid rgba(255,255,255,.05);

    }

    .header-inner{

      width:min(1100px,92%);

      margin:auto;

      height:72px;

      display:flex;

      align-items:center;

      justify-content:space-between;

    }

    .logo{

      font-size:22px;

      font-weight:800;

      color:white;

      text-decoration:none;

    }

    .back{

      color:#cbd6ea;

      text-decoration:none;

      font-weight:600;

      font-size:14px;

      padding:9px 13px;

      border:1px solid #263853;

      border-radius:9px;

      transition:.2s;

    }

    .back:hover{

      border-color:#4775e8;

      background:rgba(93,140,255,.08);

    }

    main{

      width:min(680px,92%);

      margin:45px auto 70px;

    }

    .title{

      margin-bottom:25px;

    }

    .title h1{

      font-size:30px;

      margin-bottom:7px;

    }

    .title p{

      color:var(--muted);

      font-size:15px;

    }

    .card{

      background:
        linear-gradient(
          145deg,
          rgba(17,28,48,.96),
          rgba(10,17,30,.96)
        );

      border:1px solid #203452;

      border-radius:18px;

      padding:25px;

      box-shadow:0 20px 60px rgba(0,0,0,.25);

    }

    .field{

      margin-bottom:19px;

    }

    label{

      display:block;

      font-size:14px;

      font-weight:700;

      margin-bottom:7px;

      color:#dce5f7;

    }

    input,
    select,
    textarea{

      width:100%;

      padding:13px 14px;

      border-radius:10px;

      border:1px solid #263853;

      background:#0a111e;

      color:white;

      outline:none;

      font-size:15px;

      transition:.2s;

    }

    input:focus,
    select:focus{

      border-color:#4775e8;

      box-shadow:0 0 0 3px rgba(93,140,255,.10);

    }

    input:disabled{

      opacity:.6;

      cursor:not-allowed;

    }

    textarea{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #263853;background:#0a111e;color:white;outline:none;font:15px Arial,Helvetica,sans-serif;resize:vertical;min-height:100px;}

    select{

      appearance:auto;

    }

    option{

      background:#0a111e;

      color:white;

    }

    .profile-specific{

      display:none;

      margin-top:5px;

      padding-top:20px;

      border-top:1px solid #1c2b46;

    }

    .profile-specific.active{

      display:block;

    }

    .section-title{

      font-size:16px;

      font-weight:800;

      margin-bottom:18px;

      color:#f5f7ff;

    }

    .actions{

      display:flex;

      gap:12px;

      margin-top:27px;

    }

    button,
    .cancel{

      flex:1;

      min-height:46px;

      border-radius:10px;

      font-size:15px;

      font-weight:750;

      cursor:pointer;

      text-decoration:none;

      display:flex;

      align-items:center;

      justify-content:center;

      transition:.2s;

    }

    .cancel{

      border:1px solid #263853;

      color:#dce5f7;

      background:transparent;

    }

    .cancel:hover{

      background:rgba(255,255,255,.04);

    }

    button{

      border:1px solid #4775e8;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue2)
        );

      color:white;

      box-shadow:0 12px 30px rgba(61,111,232,.18);

    }

    button:hover{

      transform:translateY(-1px);

      filter:brightness(1.08);

    }

    button:disabled{

      opacity:.6;

      cursor:not-allowed;

      transform:none;

    }

    .message{

      margin-top:18px;

      padding:12px 14px;

      border-radius:10px;

      display:none;

      font-size:14px;

    }

    .message.success{

      display:block;

      background:rgba(34,197,94,.10);

      border:1px solid rgba(34,197,94,.25);

      color:#86efac;

    }

    .message.error{

      display:block;

      background:rgba(239,68,68,.10);

      border:1px solid rgba(239,68,68,.25);

      color:#fca5a5;

    }

    .loading{

      text-align:center;

      color:var(--muted);

      padding:60px 20px;

    }


    .avatar-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      padding:8px 0 4px;
    }
    .avatar-preview{
      width:148px;
      height:148px;
      flex:none;
      border-radius:50%;
      border:3px solid #4775e8;
      background:#343b4b;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      font-size:52px;
      font-weight:700;
      padding:0;
      cursor:pointer;
      box-shadow:0 8px 26px rgba(0,0,0,.28);
    }
    .avatar-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .avatar-hint{
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }
    .avatar-modal{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:rgba(0,0,0,.88);
      backdrop-filter:blur(8px);
    }
    .avatar-modal.open{display:flex;}
    .avatar-modal-content{
      width:min(520px,100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }
    .avatar-modal-image{
      display:block;
      max-width:min(88vw,480px);
      max-height:68vh;
      width:auto;
      height:auto;
      object-fit:contain;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.16);
    }
    .avatar-modal-fallback{
      width:min(78vw,360px);
      aspect-ratio:1;
      border-radius:50%;
      background:#343b4b;
      border:3px solid #4775e8;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:100px;
      font-weight:700;
    }
    .avatar-modal-actions{
      width:100%;
      display:flex;
      gap:12px;
    }
    .avatar-modal-actions button{min-height:48px;}
    .avatar-modal-image{
      width:100%;
      height:100%;
      max-width:none;
      max-height:none;
      object-fit:cover;
      border:0;
      border-radius:0;
    }
    .hidden{display:none!important}
    .crop-frame{
      width:min(78vw,320px);aspect-ratio:1;border-radius:50%;overflow:hidden;
      position:relative;border:3px solid #6d91ff;background:#343b4b;
      touch-action:none;box-shadow:0 12px 38px rgba(0,0,0,.4);
    }
    .crop-frame.preview-mode{
      width:auto;height:auto;max-width:min(88vw,480px);max-height:68vh;
      aspect-ratio:auto;border:0;border-radius:14px;overflow:visible;
      background:transparent;box-shadow:none;touch-action:auto;
    }
    .crop-image{
      position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none;
    }
    .avatar-modal-image{
      display:block;max-width:min(88vw,480px);max-height:68vh;width:auto;height:auto;
      object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.16);
    }
    .crop-frame.preview-mode .avatar-modal-image{max-width:min(88vw,480px);max-height:68vh}
    .remove-avatar-button{background:#351820;border:1px solid #85404c;box-shadow:none;color:#ffdce1}
    .avatar-modal-actions button{font-size:13px;padding:10px 8px}
    .avatar-close{
      position:absolute;
      top:18px;
      right:20px;
      width:44px;
      height:44px;
      min-height:44px;
      flex:none;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.10);
      box-shadow:none;
      font-size:25px;
    }

    @media(max-width:600px){

      main{

        margin-top:30px;

      }

      .card{

        padding:20px;

      }

      .title h1{

        font-size:26px;

      }

      .actions{

        flex-direction:column-reverse;

      }

    }

  </style>

</head>

<body>

  <header>

    <div class="header-inner">

      <a href="index.html" class="logo">
        Conecta ADM
      </a>

      <a href="vagas.html" class="back">
        ← Voltar
      </a>

    </div>

  </header>


  <main>

    <div class="title">

      <h1>Editar perfil</h1>

      <p>
        Complete ou atualize suas informações.
      </p>

    </div>


    <div id="loading" class="loading">

      Carregando seu perfil...

    </div>


    <div id="content" style="display:none;">

      <div class="card">

        <form id="profileForm">


          <div class="field">
            <label>Foto de perfil</label>
            <div class="avatar-area">
              <button type="button" id="avatarPreview" class="avatar-preview" aria-label="Ampliar foto de perfil">
                <span id="avatarInitial">?</span>
                <img id="avatarImage" alt="Foto de perfil" style="display:none;">
              </button>
              <p class="avatar-hint">Toque na foto para visualizar e editar.</p>
            </div>
            <input type="file" id="avatarFile" accept="image/*" hidden>
          </div>

          <div class="field">

            <label for="fullName">
              Nome completo
            </label>

            <input
              type="text"
              id="fullName"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="email">
              E-mail
            </label>

            <input
              type="email"
              id="email"
              disabled
            >

          </div>


          <div class="field">

            <label for="phone">
              Telefone
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="(11) 12345-6789"
              maxlength="15"
              inputmode="numeric"
            >

          </div>


          <div class="field">

            <label for="state">
              Estado
            </label>

            <select id="state">

              <option value="">
                Selecione seu estado
              </option>

              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>

            </select>

          </div>


          <div class="field">

            <label for="city">
              Cidade
            </label>

            <input
              type="text"
              id="city"
              placeholder="Ex.: Registro"
            >

          </div>


          <!-- ESTUDANTE -->

          <div
            id="studentFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações acadêmicas
            </div>

            <div class="field">

              <label for="school">
                Escola / Faculdade
              </label>

              <input
                type="text"
                id="school"
                placeholder="Nome da escola ou faculdade"
              >

            </div>

            <div class="field"><label for="course">Curso / área de interesse</label><input id="course" placeholder="Ex.: Administração"></div>
            <div class="field"><label for="education">Escolaridade atual</label><select id="education"><option value="">Selecione</option><option>Ensino fundamental</option><option>Ensino médio cursando</option><option>Ensino médio completo</option><option>Ensino técnico cursando</option><option>Ensino técnico completo</option><option>Graduação cursando</option><option>Graduação completa</option></select></div>
            <div class="field"><label for="skills">Habilidades</label><textarea id="skills" placeholder="Organização, atendimento, Excel, comunicação..." rows="4"></textarea></div>
            <div class="field"><label for="availability">Disponibilidade</label><input id="availability" placeholder="Ex.: manhã, tarde, meio período"></div>
            <div class="field"><label for="experience">Experiência profissional</label><textarea id="experience" placeholder="Experiências, estágios, projetos ou atividades voluntárias" rows="4"></textarea></div>
            <div class="field"><label for="summary">Resumo profissional</label><textarea id="summary" placeholder="Conte um pouco sobre você e seus objetivos" rows="4"></textarea></div>
            <div class="field"><button type="button" id="createResume" style="width:100%">Criar meu currículo</button></div>
          </div>


          <!-- EMPRESA -->

          <div
            id="companyFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações da empresa
            </div>

            <div class="field">

              <label for="companyName">
                Nome da empresa
              </label>

              <input
                type="text"
                id="companyName"
                placeholder="Nome da empresa"
              >

            </div>


            <div class="field">

              <label for="segment">
                Segmento
              </label>

              <input
                type="text"
                id="segment"
                placeholder="Ex.: Tecnologia"
              >

            </div>

          </div>


          <!-- INSTITUIÇÃO -->

          <div
            id="institutionFields"
            class="profile-specific"
          >

            <div class="section-title">
              Informações da instituição
            </div>

            <div class="field">

              <label for="institutionName">
                Nome da instituição
              </label>

              <input
                type="text"
                id="institutionName"
                placeholder="Nome da instituição"
              >

            </div>


            <div class="field">

              <label for="institutionType">
                Tipo de instituição
              </label>

              <input
                type="text"
                id="institutionType"
                placeholder="Ex.: Escola, Faculdade, Universidade"
              >

            </div>

          </div>


          <div class="actions">

            <a
              href="vagas.html"
              class="cancel"
            >
              Cancelar
            </a>

            <button
              type="submit"
              id="saveButton"
            >
              Salvar alterações
            </button>

          </div>


          <div
            id="message"
            class="message"
          ></div>


        </form>

      </div>

    </div>

  </main>



  <div id="avatarModal" class="avatar-modal" role="dialog" aria-modal="true" aria-label="Foto de perfil">
    <button type="button" id="closeAvatarModal" class="avatar-close" aria-label="Fechar">×</button>
    <div class="avatar-modal-content">
      <div class="crop-frame" id="cropFrame">
        <img id="avatarModalImage" class="crop-image" alt="Ajuste o enquadramento da foto">
        <div id="avatarModalFallback" class="avatar-modal-fallback">?</div>
      </div>
      <p class="avatar-hint" id="cropHint">Arraste a foto para escolher o enquadramento.</p>
      <div class="avatar-modal-actions">
        <button type="button" id="editAvatarButton">Trocar foto</button>
        <button type="button" id="removeAvatarButton" class="remove-avatar-button">Excluir foto</button>
        <button type="button" id="applyCropButton">Usar foto</button>
      </div>
    </div>
  </div>

  <script>

    const client =
      window.getSupabaseClient();


    const loading =
      document.getElementById("loading");

    const content =
      document.getElementById("content");

    const form =
      document.getElementById("profileForm");

    const message =
      document.getElementById("message");

    const saveButton =
      document.getElementById("saveButton");


    const fullNameInput =
      document.getElementById("fullName");

    const emailInput =
      document.getElementById("email");

    const phoneInput =
      document.getElementById("phone");

    const stateInput =
      document.getElementById("state");

    const cityInput =
      document.getElementById("city");


    const studentFields =
      document.getElementById("studentFields");

    const companyFields =
      document.getElementById("companyFields");

    const institutionFields =
      document.getElementById("institutionFields");


    const schoolInput =
      document.getElementById("school");

    const companyNameInput =
      document.getElementById("companyName");

    const segmentInput =
      document.getElementById("segment");

    const institutionNameInput =
      document.getElementById("institutionName");

    const institutionTypeInput =
      document.getElementById("institutionType");


    let currentUser = null;


    let profileType = null;
    let currentAvatarUrl = null;

    const avatarFileInput = document.getElementById("avatarFile");
    const avatarPreview = document.getElementById("avatarPreview");
    const avatarImage = document.getElementById("avatarImage");
    const avatarInitial = document.getElementById("avatarInitial");
    const avatarModal = document.getElementById("avatarModal");
    const avatarModalImage = document.getElementById("avatarModalImage");
    const avatarModalFallback = document.getElementById("avatarModalFallback");
    const closeAvatarModal = document.getElementById("closeAvatarModal");
    const editAvatarButton = document.getElementById("editAvatarButton");
    const removeAvatarButton = document.getElementById("removeAvatarButton");
    const applyCropButton = document.getElementById("applyCropButton");
    const cropFrame = document.getElementById("cropFrame");
    let cropSource = null;
    let cropPanX = 0, cropPanY = 0, dragStartX = 0, dragStartY = 0;
    let draggingCrop = false, cropReady = false, removeAvatar = false;

    function updateAvatarPreview(url, name){
      const initial = (name || "?").trim().charAt(0).toUpperCase() || "?";
      avatarInitial.textContent = initial;
      avatarModalFallback.textContent = initial;
      if(url){
        avatarImage.onload = () => {
          avatarImage.style.display = "block";
          avatarInitial.style.display = "none";
        };
        avatarImage.onerror = () => {
          avatarImage.removeAttribute("src");
          avatarImage.style.display = "none";
          avatarInitial.style.display = "flex";
        };
        avatarImage.src = url;
      }else{
        avatarImage.onload = null;
        avatarImage.onerror = null;
        avatarImage.removeAttribute("src");
        avatarImage.style.display = "none";
        avatarInitial.style.display = "flex";
      }
    }

    function openAvatarModal(){
      avatarModalImage.style.display = "none";
      avatarModalImage.removeAttribute("style");
      avatarModalFallback.style.display = currentAvatarUrl ? "none" : "flex";
      if(currentAvatarUrl){
        avatarModalImage.src = currentAvatarUrl;
        avatarModalImage.style.display = "block";
        avatarModalImage.className = "avatar-modal-image";
      }
      cropFrame.classList.remove("cropping");
      cropFrame.classList.add("preview-mode");
      document.getElementById("cropHint").textContent = currentAvatarUrl
        ? "Sua foto atual. Você pode trocar ou excluir."
        : "Você ainda não adicionou uma foto.";
      applyCropButton.classList.add("hidden");
      removeAvatarButton.classList.toggle("hidden", !currentAvatarUrl);
      avatarModal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function startCrop(file){
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          cropSource = img;
          cropPanX = 0; cropPanY = 0;
          avatarModalImage.src = reader.result;
          avatarModalImage.className = "crop-image";
          avatarModalImage.style.display = "block";
          avatarModalFallback.style.display = "none";
          cropFrame.classList.remove("preview-mode");
          cropFrame.classList.add("cropping");
          document.getElementById("cropHint").textContent = "Arraste a foto livremente dentro do círculo para escolher o corte.";
          applyCropButton.classList.remove("hidden");
          removeAvatarButton.classList.add("hidden");
          cropReady = true;
          avatarModal.classList.add("open");
          document.body.style.overflow = "hidden";
          requestAnimationFrame(updateCropTransform);
        };
        img.onerror = () => showMessage("Não foi possível abrir essa imagem.", "error");
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function updateCropTransform(){
      if(!cropSource) return;
      const frameSize = cropFrame.clientWidth;
      const scale = Math.max(frameSize / cropSource.naturalWidth, frameSize / cropSource.naturalHeight);
      const imageWidth = cropSource.naturalWidth * scale;
      const imageHeight = cropSource.naturalHeight * scale;
      const limitX = Math.max(0, (imageWidth - frameSize) / 2);
      const limitY = Math.max(0, (imageHeight - frameSize) / 2);
      cropPanX = Math.max(-limitX, Math.min(limitX, cropPanX));
      cropPanY = Math.max(-limitY, Math.min(limitY, cropPanY));
      Object.assign(avatarModalImage.style,{
        width:imageWidth+"px",height:imageHeight+"px",maxWidth:"none",maxHeight:"none",
        left:"50%",top:"50%",
        transform:"translate(calc(-50% + "+cropPanX+"px), calc(-50% + "+cropPanY+"px))"
      });
    }

    function closeAvatarPreview(){
      avatarModal.classList.remove("open");
      cropFrame.classList.remove("preview-mode","cropping");
      document.body.style.overflow = "";
      if(cropReady){
        avatarFileInput.value = "";
        cropReady = false;
        cropSource = null;
        updateAvatarPreview(currentAvatarUrl, fullNameInput.value);
      }
    }

    avatarPreview.addEventListener("click", openAvatarModal);
    closeAvatarModal.addEventListener("click", closeAvatarPreview);
    avatarModal.addEventListener("click", (event) => {
      if(event.target === avatarModal) closeAvatarPreview();
    });
    editAvatarButton.addEventListener("click", () => avatarFileInput.click());
    document.addEventListener("keydown", (event) => {
      if(event.key === "Escape") closeAvatarPreview();
    });

    cropFrame.addEventListener("pointerdown", event => {
      if(!cropReady) return;
      draggingCrop = true;
      dragStartX = event.clientX - cropPanX;
      dragStartY = event.clientY - cropPanY;
      cropFrame.setPointerCapture(event.pointerId);
    });
    cropFrame.addEventListener("pointermove", event => {
      if(!draggingCrop) return;
      cropPanX = event.clientX - dragStartX;
      cropPanY = event.clientY - dragStartY;
      updateCropTransform();
    });
    cropFrame.addEventListener("pointerup", () => draggingCrop = false);
    cropFrame.addEventListener("pointercancel", () => draggingCrop = false);

    applyCropButton.addEventListener("click", () => {
      if(!cropSource) return;
      const size = 512, frameSize = cropFrame.clientWidth;
      const scale = Math.max(size / cropSource.naturalWidth, size / cropSource.naturalHeight);
      const canvas = document.createElement("canvas");
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext("2d");
      const dx = (size - cropSource.naturalWidth * scale) / 2 + cropPanX * size / frameSize;
      const dy = (size - cropSource.naturalHeight * scale) / 2 + cropPanY * size / frameSize;
      ctx.drawImage(cropSource, dx, dy, cropSource.naturalWidth * scale, cropSource.naturalHeight * scale);
      canvas.toBlob(blob => {
        if(!blob){showMessage("Não foi possível preparar a foto.", "error");return;}
        const croppedFile = new File([blob], "avatar.jpg", {type:"image/jpeg"});
        const transfer = new DataTransfer();
        transfer.items.add(croppedFile);
        avatarFileInput.files = transfer.files;
        const previewUrl = URL.createObjectURL(blob);
        avatarImage.src = previewUrl;
        avatarImage.style.display = "block";
        avatarInitial.style.display = "none";
        currentAvatarUrl = previewUrl;
        removeAvatar = false;
        cropReady = false;
        closeAvatarPreview();
        updateAvatarPreview(previewUrl, fullNameInput.value);
      }, "image/jpeg", .92);
    });

    removeAvatarButton.addEventListener("click", () => {
      currentAvatarUrl = null;
      avatarFileInput.value = "";
      removeAvatar = true;
      cropReady = false;
      updateAvatarPreview(null, fullNameInput.value);
      closeAvatarPreview();
      showMessage("A foto será removida quando você salvar as alterações.", "success");
    });

    fullNameInput.addEventListener("input", () => {
      if(!currentAvatarUrl && !avatarFileInput.files.length){
        updateAvatarPreview(null, fullNameInput.value);
      }
    });

    avatarFileInput.addEventListener("change", () => {
      const file = avatarFileInput.files && avatarFileInput.files[0];
      if(!file) return;
      if(!file.type.startsWith("image/")){
        showMessage("Escolha um arquivo de imagem.", "error");
        avatarFileInput.value = "";
        return;
      }
      if(file.size > 10 * 1024 * 1024){
        showMessage("A imagem deve ter no máximo 10 MB.", "error");
        avatarFileInput.value = "";
        return;
      }
      startCrop(file);
    });


    function formatPhone(value){

      let numbers =
        value.replace(/\D/g,"");

      numbers =
        numbers.substring(0,11);


      if(numbers.length <= 2){

        return numbers
          ? "(" + numbers
          : "";

      }


      if(numbers.length <= 7){

        return "(" +
          numbers.substring(0,2) +
          ") " +
          numbers.substring(2);

      }


      return "(" +
        numbers.substring(0,2) +
        ") " +
        numbers.substring(2,7) +
        "-" +
        numbers.substring(7);

    }


    phoneInput.addEventListener(
      "input",
      () => {

        phoneInput.value =
          formatPhone(
            phoneInput.value
          );

      }
    );


    function showSpecificFields(type){

      studentFields.classList.remove("active");

      companyFields.classList.remove("active");

      institutionFields.classList.remove("active");


      if(type === "student" || type === "estudante"){

        studentFields.classList.add("active");

      }

      else if(type === "empresa" || type === "company"){

        companyFields.classList.add("active");

      }

      else if(type === "institution" || type === "escola"){

        institutionFields.classList.add("active");

      }

    }


    function showMessage(
      text,
      type
    ){

      message.textContent = text;

      message.className =
        "message " + type;

    }


    async function loadProfile(){

      try{

        const {
          data: {
            user
          },
          error: userError
        } =
          await client.auth.getUser();


        if(userError){
          throw userError;
        }

        if(!user){
          window.location.href = "login.html";
          return;
        }


        currentUser = user;


        const {
          data: profile,
          error: profileError
        } =
          await client
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();


        if(profileError){

          throw profileError;

        }


        profileType =
          profile.profile_type || user.user_metadata?.tipo_de_perfil || "";


        fullNameInput.value =
          profile.full_name || "";

        currentAvatarUrl = profile.avatar_url || null;
        updateAvatarPreview(currentAvatarUrl, profile.full_name || "");


        emailInput.value =
          profile.email ||
          user.email ||
          "";


        phoneInput.value =
          formatPhone(
            profile.phone || ""
          );


        stateInput.value =
          profile.state || "";


        cityInput.value =
          profile.city || "";


        schoolInput.value =
          profile.school || "";
        const professional = JSON.parse(localStorage.getItem("conecta_professional_profile") || "{}");
        ["course","education","skills","availability","experience","summary"].forEach(id=>{
          const field=document.getElementById(id);
          if(field) field.value=professional[id]||"";
        });


        companyNameInput.value =
          profile.company_name || "";


        segmentInput.value =
          profile.segment || "";


        institutionNameInput.value =
          profile.institution_name || "";


        institutionTypeInput.value =
          profile.institution_type || "";


        showSpecificFields(
          profileType
        );


        loading.style.display =
          "none";

        content.style.display =
          "block";


      }catch(error){

        console.error(error);

        loading.innerHTML = `
          <p>
            Não foi possível carregar seu perfil.
          </p>
        `;

      }

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Salvando...";


        message.className =
          "message";


        try{

          let avatarUrlToSave = removeAvatar ? null : currentAvatarUrl;
          const selectedAvatar = avatarFileInput.files && avatarFileInput.files[0];

          if(selectedAvatar){
            const filePath = currentUser.id + "/" + Date.now() + ".jpg";
            const { error: uploadError } = await client
              .storage
              .from("avatars")
              .upload(filePath, selectedAvatar, {
                cacheControl: "3600",
                upsert: true,
                contentType: "image/jpeg"
              });
            if(uploadError) throw uploadError;
            const { data: publicUrlData } = client
              .storage
              .from("avatars")
              .getPublicUrl(filePath);
            if(!publicUrlData?.publicUrl){
              throw new Error("Não foi possível gerar o endereço da foto.");
            }
            avatarUrlToSave = publicUrlData.publicUrl;
          }

          const updatedData = {

            avatar_url: avatarUrlToSave,

            full_name:
              fullNameInput.value.trim(),

            phone:
              phoneInput.value.trim(),

            state:
              stateInput.value,

            city:
              cityInput.value.trim(),

            school:
              schoolInput.value.trim(),
            // Supplementary professional data is kept locally and reused by the resume builder.

            company_name:
              companyNameInput.value.trim(),

            segment:
              segmentInput.value.trim(),

            institution_name:
              institutionNameInput.value.trim(),

            institution_type:
              institutionTypeInput.value.trim(),

            updated_at:
              new Date().toISOString()

          };


          const {
            error
          } =
            await client
              .from("profiles")
              .update(updatedData)
              .eq("id", currentUser.id);


          if(error){

            throw error;

          }


          localStorage.setItem("conecta_professional_profile", JSON.stringify({
            course:document.getElementById("course")?.value.trim()||"",
            education:document.getElementById("education")?.value||"",
            skills:document.getElementById("skills")?.value.trim()||"",
            availability:document.getElementById("availability")?.value.trim()||"",
            experience:document.getElementById("experience")?.value.trim()||"",
            summary:document.getElementById("summary")?.value.trim()||""
          }));
          currentAvatarUrl = avatarUrlToSave;
          updateAvatarPreview(currentAvatarUrl, fullNameInput.value);
          avatarFileInput.value = "";
          removeAvatar = false;
          cropReady = false;

          showMessage(
            "Perfil atualizado com sucesso!",
            "success"
          );
          saveButton.disabled = false;
          saveButton.textContent = "Salvar alterações";

        }catch(error){

          console.error(error);

          showMessage(
            "Não foi possível salvar as alterações. Tente novamente.",
            "error"
          );


          saveButton.disabled =
            false;

          saveButton.textContent =
            "Salvar alterações";

        }

      }
    );


    document.getElementById("createResume")?.addEventListener("click",()=>{
      localStorage.setItem("conecta_professional_profile",JSON.stringify({
        course:document.getElementById("course")?.value.trim()||"",
        education:document.getElementById("education")?.value||"",
        skills:document.getElementById("skills")?.value.trim()||"",
        availability:document.getElementById("availability")?.value.trim()||"",
        experience:document.getElementById("experience")?.value.trim()||"",
        summary:document.getElementById("summary")?.value.trim()||""
      }));
      window.location.href="perfil-profissional.html";
    });
    loadProfile();

  </script>

</body>
